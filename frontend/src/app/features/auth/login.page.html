<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="auth-card__mark">RD</span>
      <div>
        <h1 class="rd-h2">Sign in to RobDev</h1>
        <p class="rd-small">Multi-agent game studio control room</p>
      </div>
    </div>

    @if (serverError()) {
      <div class="auth-card__error" role="alert">{{ serverError() }}</div>
    }

    <form class="rd-stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="rd-field">
        <span class="rd-field__label">Email</span>
        <input
          type="email"
          class="rd-input"
          formControlName="email"
          autocomplete="email"
          placeholder="operator@robdev.local"
          [attr.aria-invalid]="fieldError('email') !== null"
        />
        @if (fieldError('email'); as err) {
          <span class="rd-field__error">{{ err }}</span>
        }
      </label>

      <label class="rd-field">
        <span class="rd-field__label">Password</span>
        <input
          type="password"
          class="rd-input"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••••••"
          [attr.aria-invalid]="fieldError('password') !== null"
        />
        @if (fieldError('password'); as err) {
          <span class="rd-field__error">{{ err }}</span>
        }
      </label>

      <button
        type="submit"
        class="rd-btn rd-btn--primary rd-btn--lg auth-card__submit"
        [disabled]="submitting()"
      >
        @if (submitting()) {
          <rd-spinner [size]="16" />
        }
        <span>Sign in</span>
      </button>
    </form>

    <p class="auth-card__footer rd-small">
      New studio operator?
      <a routerLink="/register" class="auth-card__link">Create account</a>
    </p>
  </div>
</div>
