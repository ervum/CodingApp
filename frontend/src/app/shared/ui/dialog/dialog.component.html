<dialog
  #dlg
  class="dialog"
  [style.--dialog-w]="width()"
  (click)="onBackdropClick($event)"
  (close)="onNativeClose()"
>
  <div class="dialog__panel">
    <header class="dialog__header">
      <div class="dialog__header-titles">
        <h2 class="rd-h3">{{ title() }}</h2>
        @if (subtitle()) {
          <p class="dialog__subtitle">{{ subtitle() }}</p>
        }
      </div>
      <button
        type="button"
        class="rd-btn rd-btn--ghost rd-btn--icon"
        aria-label="Close dialog"
        (click)="closeDialog()"
      >
        <rd-icon name="x" [size]="16" />
      </button>
    </header>
    <div class="dialog__body">
      <ng-content />
    </div>
  </div>
</dialog>
